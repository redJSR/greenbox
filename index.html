<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vectormotion Speedframe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Tahoma', 'MS Sans Serif', sans-serif;
            font-size: 11px;
        }
        body {
            background-color: #f3efe2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .xp-window {
            width: 100%;
            max-width: 1100px;
            height: 750px;
            background: #d4d0c8;
            border: 3px solid #0055ea;
            border-radius: 8px 8px 0 0;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .xp-title-bar {
            background: linear-gradient(to bottom, #0058ee 0%, #3593ff 4%, #288ace 6%, #0058ee 10%, #0055ea 90%, #003dd7 100%);
            padding: 4px 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            font-weight: bold;
            font-size: 12px;
            text-shadow: 1px 1px 1px #000;
        }
        .title-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .title-logo {
            height: 20px;
            cursor: pointer;
        }
        .title-icon {
            height: 18px;
        }
        .window-controls {
            display: flex;
            gap: 2px;
        }
        .xp-btn {
            width: 21px;
            height: 21px;
            border: 1px solid #ffffff;
            border-radius: 3px;
            background: linear-gradient(to bottom, #ece9d8, #d4d0c8);
            font-weight: bold;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: inset -1px -1px #808080, inset 1px 1px #ffffff;
        }
        .xp-btn-close {
            background: linear-gradient(to bottom, #e76d54, #be381e);
            color: white;
        }
        .menu-bar {
            background: #d4d0c8;
            display: flex;
            padding: 2px 4px;
            border-bottom: 1px solid #808080;
        }
        .menu-item {
            padding: 2px 8px;
            cursor: pointer;
        }
        .menu-item:hover {
            background: #0a246a;
            color: white;
        }
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
            background: #808080;
        }
        .toolbar {
            width: 56px;
            background: #d4d0c8;
            border-right: 2px solid #ffffff;
            box-shadow: inset -1px 0 #808080;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px;
            gap: 2px;
        }
        .tool-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
        }
        .tool-btn {
            width: 22px;
            height: 22px;
            background: #d4d0c8;
            border: 1px solid #ffffff;
            box-shadow: inset -1px -1px #808080;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
        }
        .tool-btn.active {
            background: #ece9d8;
            box-shadow: inset 1px 1px #808080;
            border: 1px inset #808080;
        }
        .tool-options {
            margin-top: 10px;
            width: 100%;
            border-top: 1px solid #808080;
            padding-top: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .color-swatch {
            width: 20px;
            height: 20px;
            border: 1px solid #000;
            cursor: pointer;
        }
        .main-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .timeline-container {
            height: 140px;
            background: #d4d0c8;
            border-bottom: 2px solid #808080;
            display: flex;
            flex-direction: column;
        }
        .timeline-controls {
            height: 24px;
            background: #ece9d8;
            border-bottom: 1px solid #808080;
            display: flex;
            align-items: center;
            padding: 0 6px;
            gap: 12px;
        }
        .timeline-controls button {
            padding: 1px 6px;
            background: #d4d0c8;
            border: 1px solid #fff;
            box-shadow: inset -1px -1px #808080, inset 1px 1px #fff;
            cursor: pointer;
        }
        .timeline-controls button:active {
            box-shadow: inset 1px 1px #808080;
        }
        .timeline-body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        .layer-pane {
            width: 150px;
            background: #ffffff;
            border-right: 2px solid #808080;
            overflow-y: auto;
        }
        .layer-item {
            height: 20px;
            border-bottom: 1px solid #d4d0c8;
            padding: 2px 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #e0e0e0;
        }
        .layer-item.selected {
            background: #0a246a;
            color: white;
        }
        .frame-pane {
            flex: 1;
            background: #ffffff;
            overflow-x: auto;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .frame-ruler {
            height: 20px;
            background: #d4d0c8;
            border-bottom: 1px solid #808080;
            display: flex;
        }
        .frame-strip {
            height: 20px;
            display: flex;
            background: #fff;
        }
        .frame-cell {
            width: 12px;
            height: 100%;
            border-right: 1px solid #c0c0c0;
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
            font-size: 9px;
            text-align: center;
            line-height: 20px;
            color: #666;
        }
        .frame-strip .frame-cell {
            border-bottom: 1px solid #c0c0c0;
            background: #f0f0f0;
        }
        .frame-strip .frame-cell.has-content {
            background: #c0c0c0;
        }
        .frame-strip .frame-cell.has-content::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 4px;
            background: #000;
            border-radius: 5px;
            top: 8px;
            left: 4px;
        }
        .frame-cell.active-frame {
            background: #ff0000 !important;
            color: #fff !important;
        }
        .frame-strip .frame-cell.active-frame::after {
            background: #fff;
        }
        .stage-container {
            flex: 1;
            background: #808080;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            position: relative;
        }
        .stage-canvas-wrapper {
            background: #ffffff;
            box-shadow: 3px 3px 8px rgba(0,0,0,0.5);
            position: relative;
        }
        canvas {
            display: block;
            cursor: crosshair;
        }
        .portal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #f3efe2;
            z-index: 100;
            padding: 40px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .portal-overlay.active {
            display: flex;
        }
        .portal-card {
            background: #ffffff;
            border: 2px solid #0055ea;
            border-radius: 6px;
            padding: 20px;
            max-width: 500px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }
        .portal-card h2 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #0055ea;
        }
        .portal-card button {
            margin-top: 15px;
            padding: 4px 12px;
            background: #d4d0c8;
            border: 2px solid #ffffff;
            box-shadow: inset -1px -1px #808080;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="xp-window">
        <!-- XP Title Bar -->
        <div class="xp-title-bar">
            <div class="title-left">
                <img src="assets/vectormotion-logo.png" alt="Vectormotion" class="title-logo" id="vectormotionLogo" title="Click to go Home">
                <img src="assets/speedframe-icon.png" alt="Speedframe" class="title-icon">
                <span>Vectormotion Speedframe - [Movie1]</span>
            </div>
            <div class="window-controls">
                <div class="xp-btn">_</div>
                <div class="xp-btn">□</div>
                <div class="xp-btn xp-btn-close">✕</div>
            </div>
        </div>

        <!-- Menu Bar -->
        <div class="menu-bar">
            <div class="menu-item">File</div>
            <div class="menu-item">Edit</div>
            <div class="menu-item">View</div>
            <div class="menu-item">Insert</div>
