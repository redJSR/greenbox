<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vectormotion Speedframe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: "Tahoma", "MS Sans Serif", sans-serif;
            font-size: 11px;
        }

        body {
            background-color: #f3efe2; /* Classic tannish background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        /* 4:3 Aspect Ratio Window */
        .xp-window {
            width: 800px;
            height: 600px;
            background: #d4d0c8;
            border: 3px solid #0055ea;
            border-radius: 4px 4px 0 0;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.4);
            overflow: hidden;
        }

        /* Title bar */
        .title-bar {
            background: linear-gradient(to right, #0058ee, #3593ff, #0055ea);
            height: 24px;
            padding: 0 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            font-weight: bold;
        }

        .title-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo-badge {
            background: #22b14c;
            color: white;
            padding: 1px 4px;
            border-radius: 2px;
            font-size: 10px;
            cursor: pointer;
        }

        .window-btns {
            display: flex;
            gap: 2px;
        }

        .btn-win {
            width: 16px;
            height: 14px;
            background: #d4d0c8;
            border: 1px solid #ffffff;
            border-right-color: #000;
            border-bottom-color: #000;
            font-size: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-weight: bold;
        }

        .btn-close {
            background: #e76d54;
            color: white;
        }

        /* Menu Bar */
        .menu-bar {
            background: #d4d0c8;
            border-bottom: 1px solid #808080;
            display: flex;
            padding: 2px 4px;
        }

        .menu-item {
            padding: 2px 6px;
            cursor: pointer;
        }

        .menu-item:hover {
            background: #0a246a;
            color: white;
        }

        /* Workspace Grid Layout */
        .workspace {
            display: flex;
            flex: 1;
            background: #c0c0c0;
            overflow: hidden;
        }

        /* Flash 2 Double-Column Left Toolbar */
        .toolbar {
            width: 52px;
            background: #d4d0c8;
            border-right: 2px solid #ffffff;
            box-shadow: inset -1px 0 #808080;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3px;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: 22px 22px;
            gap: 2px;
        }

        .t-btn {
            width: 22px;
            height: 22px;
            background: #d4d0c8;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }

        .t-btn.active, .t-btn:active {
            border-color: #808080 #ffffff #ffffff #808080;
            background: #e0e0e0;
        }

        /* Center Main Pane */
        .main-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Timeline Pane */
        .timeline-box {
            height: 120px;
            background: #d4d0c8;
            border-bottom: 2px solid #808080;
            display: flex;
            flex-direction: column;
        }

        .timeline-header {
            height: 20px;
            background: #ece9d8;
            border-bottom: 1px solid #808080;
            display: flex;
            align-items: center;
            padding: 0 6px;
            gap: 12px;
        }

        .timeline-content {
            flex: 1;
            display: flex;
            background: #ffffff;
        }
